[package]
name = "whatsapp-mcp"
version = "0.2.0"
edition = "2024"
description = "Small read-only MCP server for the WhatsApp macOS database"
license = "MIT"
repository = "https://github.com/santissimoo/whatsapp-mcp"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
